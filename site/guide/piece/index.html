<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Piece — The Hitchhiker's Guide to the Future</title><style>:root{--void:#090811;--ink:#f4efe5;--muted:#aaa5a4;--gold:#e2b75d;--ember:#d86f4c;--line:rgba(244,239,229,.15)}*{box-sizing:border-box}body{margin:0;background:var(--void);color:var(--ink);font-family:Georgia,'Times New Roman',serif}.wrap{max-width:850px;margin:auto;padding:28px 22px 100px}header{display:flex;justify-content:space-between;color:#686a76;font:10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.15em;text-transform:uppercase;border-bottom:1px solid var(--line);padding-bottom:20px}a{color:inherit;text-decoration:none}a:hover{color:var(--gold)}main{padding-top:13vh}.kicker{color:var(--ember);font:11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.15em;text-transform:uppercase}h1{font-size:clamp(42px,7vw,76px);font-weight:400;line-height:.98;margin:20px 0 18px;color:var(--gold)}.meta{color:#686a76;font:11px ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;letter-spacing:.08em;margin-bottom:55px}.body{font-size:20px;line-height:1.7;color:var(--muted);white-space:pre-wrap}.back{display:inline-block;margin-top:60px;border-bottom:1px solid var(--gold);padding-bottom:8px;color:var(--gold);font:11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase}.error{color:var(--ember);font:14px ui-monospace,SFMono-Regular,Menlo,monospace}</style></head><body><div class="wrap"><header><a href="/">HGF / GUIDE</a><a href="/">Return to the map</a></header><main id="piece"><p class="kicker">Following a real thread</p><p class="error">Loading the piece…</p></main></div><script>const main=document.getElementById('piece');const id=new URLSearchParams(location.search).get('id');if(!id){main.innerHTML='<p class="error">No piece was specified.</p>'}else{fetch('/api/guide/piece?id='+encodeURIComponent(id)).then(r=>r.json().then(d=>({ok:r.ok,d}))).then(({ok,d})=>{if(!ok)throw Error(d.error||'Piece unavailable');const p=d.piece;document.title=p.title+' — The Hitchhiker\'s Guide to the Future';main.innerHTML='<p class="kicker">'+escapeHtml(p.source)+' · imported history</p><h1>'+escapeHtml(p.title)+'</h1><p class="meta">'+escapeHtml(p.day)+' · '+escapeHtml(p.source)+(p.source_url?' · <a href="'+escapeHtml(p.source_url)+'" target="_blank" rel="noreferrer">original publication ↗</a>':'')+'</p><div class="body">'+escapeHtml(p.body)+'</div><a class="back" href="/">← Trace another question</a>'}).catch(e=>main.innerHTML='<p class="error">'+escapeHtml(e.message)+'</p>')}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></body></html>
